databases:
  - name: component-board-db
    plan: free
    databaseName: board
    user: board
    region: oregon
services:
  - type: web
    name: component-board
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: component-board-db
          property: connectionString
      - key: INVITE_CODE
        sync: false
      - key: OWNER_CODE
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DATABASE_EXPIRES_AT
        sync: false
      - key: COOKIE_SECURE
        value: "true"
